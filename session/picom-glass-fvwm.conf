# Longhorn-style glass preset for picom v13 on fvwm (frames are fvwm's opaque pixmaps, so make the frame region translucent)
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = false;
use-ewmh-active-win = true;
detect-client-opacity = true;
detect-rounded-corners = true;
dithered-present = false;

# the DWM shadow plate: soft, dark, offset slightly down
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.55;
shadow-offset-x = -18;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'FvwmPager'",
  "_GTK_FRAME_EXTENTS@"
];

# glass: the WM frame becomes translucent and the desktop is blurred behind it,
# the client stays opaque (this is the LGFRAME plate + LegacyContent split)
frame-opacity = 0.72;
inactive-opacity = 1.0;
active-opacity = 1.0;
blur-background = true;          # also blurs behind translucent regions of ARGB clients (the 'extended frame' case)
blur-background-frame = true;
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'FvwmPager'"
];

# the chamfered plate corners (~5px in the 4074 frame textures)
corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'FvwmPager'",
  "class_g = 'FvwmButtons'"
];

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;

wintypes:
{
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = true; };
  dropdown_menu = { opacity = 1.0; };
  tooltip = { fade = true; shadow = false; opacity = 0.95; };
};
