# Longhorn-style glass preset for picom v13 (luxwm, imported from x11 d353b69; the comments say lhwm, its old name; picom-glass-fvwm.conf is the fvwm variant)
# Glass accuracy (docs/LUXWM.md "Glass accuracy" has the measurements):
#  - blur: SS_GLASSSHADER averages 9 taps on a 3x3 grid at 1.5 px = a Gaussian of sigma ~1.2 px (4074-dwm.png agrees: sigma 1.2 fits best).
#    dual_kawase strength 1 (sigma ~1.9, the mildest level) on glx; the xrender lab (lab.sh) uses gaussian size 5 / deviation 1.2.
#    The old strength 6 (sigma ~6+) / gaussian 10x5 washed the wallpaper into a milky haze.
#  - alpha: plate_active.png is straight (non-premultiplied) alpha, as cairo expects: nothing to convert
#  - shadow: one shadow, cast by the decoration window (clients carry _LHWM_DECORATED, see shadow-exclude), shaped like LGFRAMESHADOW
#    (shadow.png): sigma ~10 px (radius 22), peak 0.53, shifted ~15 px left and ~13 px down. picom draws it only outside the window.
backend = "glx";
vsync = true;
# no partial repaints: picom 13 sometimes never repaints a newly mapped window's area once the window has drawn into it (the
# window's own pixmap holds the content, the screen keeps what was behind it until the next damage of each part). It happens when
# picom has imported the window before it was mapped and the window opens with an animation or a fade (about 1 in 5 Display
# Properties launches in the lab); full-frame repaints never miss it (0 in 50).
use-damage = false;
unredir-if-possible = false;
use-ewmh-active-win = true;
detect-client-opacity = true;
detect-rounded-corners = true;
dithered-present = false;

# the DWM shadow plate (LGFRAMESHADOW): soft, dark, shifted left and down; the offsets are calibrated on the lab so the shadow rect
# lands ~15 px left and ~13 px down of the plate (picom puts the rect at offset + ~radius)
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.52;
shadow-offset-x = -33;
shadow-offset-y = -6;
# per-window exceptions are window rules (picom v13 "rules" below): they are needed for the lhwm animations, and once "rules" is
# set picom ignores shadow-exclude, blur-background-exclude, rounded-corners-exclude, fade-exclude and wintypes, so those moved there

# lhwm paints real ARGB frames, so picom must NOT erode clients by their _NET_FRAME_EXTENTS
# (that is what frame-opacity does for reparenting WMs; picom-glass-fvwm.conf keeps it for fvwm)
frame-opacity = 1.0;
blur-background = true;          # also blurs behind translucent regions of ARGB clients (the 'extended frame' case)
blur-background-frame = false;
blur-method = "dual_kawase";
blur-strength = 1;               # mildest dual_kawase level, sigma ~1.9 px: closest to the shader's 3x3 box at 1.5 px (sigma 1.2)

# the plate texture already has rounded, alpha corners; picom must not round the (square) clients
corner-radius = 0;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;

# ---- window rules (picom v13). Order matters: later rules override earlier ones. ----
# lhshell's desktop layer (window_type 'desktop') is NOT excluded: with it excluded, picom 13 (xrender, Xvfb) stopped
# painting a maximised client raised from under another window while the layer was mapped (the wallpaper showed instead).
# Blurring behind it only shows during its 400 ms fade.
rules = (
  { match = "window_type = 'dock'"; shadow = false; clip-shadow-above = true; corner-radius = 0; },
  { match = "window_type = 'desktop'"; shadow = false; corner-radius = 0;
    fade = false; },                      # lhshell's desktop layer does its own 400 ms fade to black
  { match = "window_type = 'dnd'"; shadow = false; },
  { match = "window_type = 'popup_menu'"; opacity = 1.0; shadow = true; },
  { match = "_LHWM_MENU@"; shadow = false; blur-background = false; },   # lhwm's window menu draws XP's own 5 px drop shadow (docs/LUXWM.md "The window menu")
  { match = "_LH_DROP_SHADOW@"; shadow = false; blur-background = false; },   # wux's popup menus and their shadow windows: XP's own drop shadow (docs/CLIENT-PROTOCOL.md)
  { match = "window_type = 'dropdown_menu'"; opacity = 1.0; },
  { match = "window_type = 'tooltip'"; shadow = false; opacity = 0.95; },
  { match = "window_type = 'notification'"; shadow = false; corner-radius = 0; },   # lhshell toasts draw their own rim and rounded shape
  { match = "class_g = 'FvwmPager'"; shadow = false; blur-background = false; corner-radius = 0; },
  { match = "class_g = 'FvwmButtons'"; corner-radius = 0; },
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },
  { match = "_LHWM_MAXIMIZED@ = 1"; shadow = false; },    # lhwm: maximised frames (decoration windows) fill the work area, no shadow.
                                    # "@": the top-level itself (lhwm does not reparent; the client-window form is not re-read
                                    # when the property changes)
  { match = "_LHWM_EXTEND_FRAME@"; shadow = false;   # lhwm extended frames (docs/CLIENT-PROTOCOL.md): the frame casts the shadow;
    blur-background = false; },     # the client's own would be a dark seam on the glass along its top edge. Its transparent header
                                    # lies on the decoration window, which is blurred already; blurring the client too would blur
                                    # the plate again
  { match = "_LHWM_DECORATED@"; shadow = false; },   # lhwm sets it (CARDINAL 1) on every client that has a decoration window: the
                                    # plate casts the shadow, the client (9 px inside it) would cast a second one

  # ---- lhwm animations (docs/LUXWM.md "Animations", the workspace COMPOSITION.md 14). They match only windows carrying _LHWM_ANIMATE, which
  # lhwm (config.h ANIMATE) sets on its clients and their decoration windows before mapping them, so other window managers on this
  # config are not affected. Its value is config.h ANIMATE_STYLE:
  #   7 = ANIM_4074PLUS (default): open and restore from minimised grow + fade in from the bottom edge (the invented "show"), minimise
  #       shrinks + fades out towards it (the invented "hide"), close = picom's default fade, maximise/restore: no picom animation
  #       (lhwm moves the window in one step and crossfades the DWM frame plate, 400 ms, with lhshell's black layers)
  #   1 = ANIM_4074: Longhorn 4074's open/restore fade + flattened door swing; minimise, close, maximise instant
  #   5 = ANIM_5048: the April 2005 uDWM curve for open/restore; the rest instant
  #   3 = ANIM_INVENTED: the invented minimise/restore, default fade on open/close, and picom's geometry animation on maximise/restore
  #       (lhwm sets 2 on client and frame while one is starting; the M5b crossfade of DWM themes with a maximised plate takes precedence)
  # Window open and restore from minimised ("open", "show"; minimise unmaps client and frame, restore maps them) are the only
  # animated transitions in 4074 and 5048; minimise, close and maximise/restore are instant there, so "hide"/"close" get a script
  # without a timing function (picom ends it at once, no default fade) and there is no geometry rule.
  # 4074 (desksrv): opacity 0 -> 1 in 350 ms on a timeline with acceleration 0.3 / deceleration 0.4 (cubic-bezier(0.35, 0, 0.575, 1)
  # is within 0.01 of it), plus a 3D swing in 300 ms (decel 0.3): the window falls in from 0.25 window-widths behind and turned 35 deg
  # about its top edge. picom has no perspective, so the swing is flattened head-on: scale-x 0.93 -> 1 about the window's centre
  # (offset-x compensates, scaling is about the top-left corner) and scale-y 0.762 (= 0.93 * cos 35 deg) -> 1 anchored at the top edge
  # (offset-y 0), on the swing's timeline (cubic-bezier(0.225, 0.2, 0.725, 1), within 0.016). Client and frame scale alike, so they
  # stay registered to within a pixel or two while nearly transparent. The perspective hinge needs the phase-2 compositor.
  { match = "_LHWM_ANIMATE@ = 1 && !window_type = 'dock' && !window_type = 'desktop' && !window_type = 'notification'";
    animations = (
      { triggers = [ "open", "show" ];
        opacity = { curve = "cubic-bezier(0.35, 0, 0.575, 1)"; duration = 0.35; start = 0; end = 1; };
        var-p = { curve = "cubic-bezier(0.225, 0.2, 0.725, 1)"; duration = 0.3; start = 0; end = 1; };
        var-sx = "0.93 + 0.07 * var-p"; var-sy = "0.762 + 0.238 * var-p";
        scale-x = "var-sx"; scale-y = "var-sy"; shadow-scale-x = "var-sx"; shadow-scale-y = "var-sy";
        offset-x = "(1 - var-sx) * window-width / 2"; offset-y = "0";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        blur-opacity = "opacity"; shadow-opacity = "opacity"; },
      { triggers = [ "hide", "close" ]; opacity = 0; blur-opacity = 0; shadow-opacity = 0; }   # instant
    ); },
  # 5048 (uDWM, ANIMATE_STYLE 5): one 266 ms curve p = sqrt(t / duration) (cubic-bezier(0, 0.55, 0.95, 1), within 0.016) for the
  # opacity and the pose; the pose (pitched 25 deg and pushed 0.75 back on open, tilted/twisted from below-left on restore) is again
  # a scale, 0.9 -> 1
  { match = "_LHWM_ANIMATE@ = 5 && !window_type = 'dock' && !window_type = 'desktop' && !window_type = 'notification'";
    animations = (
      { triggers = [ "open", "show" ];
        var-p = { curve = "cubic-bezier(0, 0.55, 0.95, 1)"; duration = 0.266; start = 0; end = 1; };
        opacity = "var-p"; var-s = "0.9 + 0.1 * var-p";
        scale-x = "var-s"; scale-y = "var-s"; shadow-scale-x = "var-s"; shadow-scale-y = "var-s";
        offset-x = "(1 - var-s) * window-width / 2"; offset-y = "(1 - var-s) * window-height / 2";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        blur-opacity = "opacity"; shadow-opacity = "opacity"; },
      { triggers = [ "hide", "close" ]; opacity = 0; blur-opacity = 0; shadow-opacity = 0; }
    ); },
  # invented (ANIMATE_STYLE 3, not Longhorn): minimise shrinks client and frame to 15 % towards the window's horizontal centre on
  # the bottom edge of its monitor while fading out, 250 ms (XP's CMS_ANIMATION); restore is the reverse. picom's scripts cannot read
  # _NET_WM_ICON_GEOMETRY (the taskbar button). A point scale s about (tx, ty) moves the top-left corner by (1 - s) * (t - corner);
  # client and frame have the same tx/ty, so they stay together. Open and close keep picom's default fade.
  { match = "(_LHWM_ANIMATE@ = 3 || _LHWM_ANIMATE@ = 2) && !window_type = 'dock' && !window_type = 'desktop' && !window_type = 'notification'";
    animations = (
      { triggers = [ "hide" ];
        var-p = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.25; start = 0; end = 1; };   # ease-in: leaves quickly
        var-s = "1 - 0.85 * var-p";
        var-tx = "window-x + window-width / 2";
        var-ty = "window-monitor-y + window-monitor-height";
        scale-x = "var-s"; scale-y = "var-s"; shadow-scale-x = "var-s"; shadow-scale-y = "var-s";
        offset-x = "(1 - var-s) * (var-tx - window-x)"; offset-y = "(1 - var-s) * (var-ty - window-y)";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        opacity = "1 - var-p"; blur-opacity = "opacity"; shadow-opacity = "opacity"; },
      { triggers = [ "show" ];
        var-p = { curve = "cubic-bezier(0, 0, 0.2, 1)"; duration = 0.25; start = 1; end = 0; };   # ease-out: settles gently
        var-s = "1 - 0.85 * var-p";
        var-tx = "window-x + window-width / 2";
        var-ty = "window-monitor-y + window-monitor-height";
        scale-x = "var-s"; scale-y = "var-s"; shadow-scale-x = "var-s"; shadow-scale-y = "var-s";
        offset-x = "(1 - var-s) * (var-tx - window-x)"; offset-y = "(1 - var-s) * (var-ty - window-y)";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        opacity = "1 - var-p"; blur-opacity = "opacity"; shadow-opacity = "opacity"; }
    ); },
  # 4074PLUS (ANIMATE_STYLE 7, default; 2026-10-25): "open" (first map) = 4074's flattened door swing + 350 ms fade, copied from
  # style 1; "show" (restore from minimised) = the invented grow of style 3: client and frame grow from 15 % at the window's horizontal
  # centre on the bottom edge of its monitor while fading in, 250 ms, ease-out (the reverse of "hide"); "hide": the shrink + fade out,
  # 250 ms, ease-in; "close" keeps picom's default fade (no rule).
  # No geometry rule: maximise/restore is lhwm's one-step move + plate crossfade (docs/LUXWM.md "Maximised mode", M5b).
  { match = "_LHWM_ANIMATE@ = 7 && !window_type = 'dock' && !window_type = 'desktop' && !window_type = 'notification'";
    animations = (
      { triggers = [ "hide" ];
        var-p = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.25; start = 0; end = 1; };
        var-s = "1 - 0.85 * var-p";
        var-tx = "window-x + window-width / 2";
        var-ty = "window-monitor-y + window-monitor-height";
        scale-x = "var-s"; scale-y = "var-s"; shadow-scale-x = "var-s"; shadow-scale-y = "var-s";
        offset-x = "(1 - var-s) * (var-tx - window-x)"; offset-y = "(1 - var-s) * (var-ty - window-y)";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        opacity = "1 - var-p"; blur-opacity = "opacity"; shadow-opacity = "opacity"; },
      # open (first map): 4074's 350 ms fade (accel 0.3 / decel 0.4 as cubic-bezier) with the gentle 0.95 -> 1 zoom about the window's
      # centre on the swing's 300 ms timeline: the first stand-in for the 3D swing (before the door-swing experiment), kept by request
      { triggers = [ "open" ];
        opacity = { curve = "cubic-bezier(0.35, 0, 0.575, 1)"; duration = 0.35; start = 0; end = 1; };
        var-p = { curve = "cubic-bezier(0.225, 0.2, 0.725, 1)"; duration = 0.3; start = 0; end = 1; };
        var-s = "0.95 + 0.05 * var-p";
        scale-x = "var-s"; scale-y = "var-s"; shadow-scale-x = "var-s"; shadow-scale-y = "var-s";
        offset-x = "(1 - var-s) * window-width / 2"; offset-y = "(1 - var-s) * window-height / 2";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        blur-opacity = "opacity"; shadow-opacity = "opacity"; },
      { triggers = [ "show" ];
        var-p = { curve = "cubic-bezier(0, 0, 0.2, 1)"; duration = 0.25; start = 1; end = 0; };
        var-s = "1 - 0.85 * var-p";
        var-tx = "window-x + window-width / 2";
        var-ty = "window-monitor-y + window-monitor-height";
        scale-x = "var-s"; scale-y = "var-s"; shadow-scale-x = "var-s"; shadow-scale-y = "var-s";
        offset-x = "(1 - var-s) * (var-tx - window-x)"; offset-y = "(1 - var-s) * (var-ty - window-y)";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        opacity = "1 - var-p"; blur-opacity = "opacity"; shadow-opacity = "opacity"; }
    ); },
  # invented maximise / restore (style 3 only): lhwm sets _LHWM_ANIMATE = 2 on client and frame just before the geometry changes and
  # back to 3 after 400 ms, so window moves, resizes, workspace switches and anything else stay unanimated
  { match = "_LHWM_ANIMATE@ = 2 && !window_type = 'dock' && !window_type = 'desktop' && !window_type = 'notification'";
    animations = ( { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.25; } ); }
);
