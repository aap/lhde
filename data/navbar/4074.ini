; The 4074 navigation bar (Explorer.navbar = 4074): flxp's own header for now (flxp/explorer/navbar.cpp, header.cpp: the
; faithful 4074 header in four sizes, Explorer.navbar_preset = small | medium | large | xlarge). luxnav has no 4074 layout yet
; (docs/NAVBAR.md "Missing"); when it reproduces flxp's header this file gets its layout and the resolver switches.
[navbar]
family = 4074
engine = flxp
presets = small medium large xlarge
