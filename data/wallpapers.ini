; Wallpapers per theme (imported from x11 d353b69; docs/THEMES.md "Wallpapers"). The one place a theme's desktop background is
; chosen; themes.ini has none. Transitional, like themes.ini: step 4 moves the choice into the theme files ([Desktop] wallpaper).
; Read by luxshell (session.lua S.wallpaper), session/lhwall.sh (the session's first root background), flxp-desktop, and published
; by luxshell as `wallpaper=` / `mode=` in _LH_THEME_RESOLVED.
;
;   [default]   root = the image directory, relative to lhde's data directories (default wallpapers: the user's imported
;               wallpapers/<build>/..., lhde-import); file, mode: the wallpaper of a theme without a section here
;   [THEME]     a registry section name (themes.ini; an alias works too, the section name is looked up first);
;               file = an image, relative to root (or absolute, or ~/...); mode = fill | fit | center | tile | stretch
;               (feh --bg-fill / --bg-max / --bg-center / --bg-tile / --bg-scale). A preset uses its base's section.
;
; Who wins (first set): settings.ini [desktop] wallpaper = none; settings.ini [override:NAME] wallpaper; the preset's own
; [Desktop] wallpaper; settings.ini [desktop] wallpaper; a `wallpaper` key in the themes.ini section; [THEME] here;
; [default] here. The mode goes with the file: the same layer's mode, else settings.ini [desktop] mode for a user's file,
; else fill. The research workspace's resources/wallpapers/README.md lists what each build ships.

[default]
root = wallpapers/
file = 4074/Bliss.bmp   ; the 4074 default: the green leaves (Bliss, builds 4067-4082)
mode = fill

