# luxwm frame set (Longhorn 4074 CompositedWindow parts)
mode = dwm
# without a compositor (no _NET_WM_CM_S0 owner) luxwm uses this frame set instead (Longhorn: USESCOMPOSITION off -> msstyles frame)
fallback_theme = jade4074-classic
# plate 9-slice insets top right bottom left: regions of the 801x607 texture kept unstretched
# (aero: the right 100px hold the caption-button pill drawn into the plate at x=701..793)
plate_insets = 27 9 9 9
# frame margins: the client sits inside the dark 1px lines at x=8, x=792, y=26, y=598 of the texture
margins = 27 9 9 9
# Explorer plate (LgFrameExplorer = msstyles STREAM 484, active top half / inactive bottom half of the 801x1214 PNG): used instead
# of the normal plate when a client extends the frame's top into its header (_LHWM_EXTEND_FRAME top > 0). desksrv 4074 9-grids it
# with a 73 px top band (texture margins 9,73 / 100,9); the rest of the grid is the normal plate's
plate_explorer = plate_explorer_active.png plate_explorer_inactive.png
explorer_insets = 73 9 9 9
# (Jade's STREAM 484 is byte-identical to 483, a flat green plate: explorer_rows keeps its default, 2 71 71)
# maximised plates (M5b): Jade 4074's LGFRAMEMAX / MAXEXPLORER (STREAM 493 / 494) are byte-identical to its LGFRAME (483): the same
# flat plate, 801x1214, halves of 607 rows; drawn with their own 9-grid and the top corners squared. (4066 has a separate 787x1198
# LGFRAMEMAX, res/4066/jade.msstyles/STREAM_491: the same two colours, active rows 0..606, inactive 607..1197, square corners)
plate_max = plate_max_active.png plate_max_inactive.png
max_insets = 27 9 9 9
plate_max_explorer = plate_max_explorer_active.png plate_max_explorer_inactive.png
max_explorer_insets = 73 9 9 9
# glass weight (COMPOSITION.md 18.1, screenshots/4066-MIL-Effects.png): the plate (112,144,112) at its own alpha 213/255 = 0.835, blended
# straight, reproduces the 4066 frame to within 1 level (the squared alpha of the aero fit is off by up to 8, the 0.5 factor by 23)
glass_alpha = 1.0
# no caption fog (4066/4074 draw none; the glow around Explorer's title is the client's own text); fog = 1 re-enables captionfog.png
fog = 0
# no edge highlight: 4066's frame edge pixels are the plate colour (COMPOSITION.md 18.1); overlay = 1 draws LGFRAMEOVERLAY
overlay = 0
# overlay texture (811x615) reaches past the plate (801x607) by top right bottom left px; its highlight line
# (texture x=5/805, y=4/610) then lies on the plate's inset-1 line (x=1/799, y=1/605)
overlay_insets = 30 30 30 30
overlay_outset = 3 4 3 4
# caption buttons: sprite sheets with 4 frames of frame_h each (normal, hot, pressed, inactive)
button_frame_h = 14
# 4066: min 27 + max 25 + close 43 abutting (no gaps), 2 px below the frame top, ending 6 px before its right edge
button_top = 2
button_right = 6
button_gap = 0
# order from the right edge
buttons = close max min
# caption text
font = Segoe UI 9
text_active = #1e1e1e
text_inactive = #5a5a5a
glow = #ffffff
# maximised caption text (README "Maximised caption text"; COMPOSITION.md 19: CompositedWindow defines no text colours, the maximised look
# lives in the rest of the style: Explorer's title turns white with the glow dropped, inactive maximised text stays (98,100,105); fits
# screenshots/aero_max.png, white title on the dark LGFRAMEMAX header). Faded with the M5b plate crossfade.
text_max_active = #ffffff
text_max_inactive = #626469
glow_max = none
# default_icon.png: CompositedWindow DEFAULTICON (msstyles STREAM 506, 20x17), shown for clients without an icon; drawn 1:1
title_x = 28
icon_x = 8
icon_size = 16
# the visual style this directory caches (README "libuxtheme source": read live through libuxtheme when luxwm has it)
msstyles = styles/jade4074.msstyles
color = Default
size = Normal
