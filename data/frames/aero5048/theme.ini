# luxwm frame set: Longhorn 5048 (April 2005) uDWM frames.
# 5048's frames were drawn by uDWM.dll from its own BITMAP resources (res/5048/uDWM.dll, COMPOSITION.md 15.4), not from the visual style:
# aero.msstyles 5048 has no COMPOSITEDWINDOW class (the msstyles keys below only name the style for the caption font/colours).
# plate = BITMAP 1000 (801x1214, active top / inactive bottom, premultiplied in the DLL, un-premultiplied here), plate_max = 1002 (787x1198,
# opaque), buttons 1003 min, 1005 max, 1007 restore, 1009 close, glows 1011 / 1013 (all un-premultiplied). The art equals the 4074
# aero theme's (the aero zip is 5048's bitmap), so insets and button geometry are the 4074 aero values. 5048 has no Explorer plate
# (4074's STREAM 484), no overlay, no shadow bitmap and no default icon: extended frames stretch the normal plate (extend_rows).
mode = dwm
# without a compositor the theme's frames_classic (none: the style's own decorations) draws the style's Window class; this theme is the last resort
# (and the classic frame when the directory is set through _LHWM_THEME): README "Classic fallback"
fallback_theme = jade4074-classic
# plate 9-slice insets top right bottom left: regions of the 801x607 texture kept unstretched
# (aero: the right 100px hold the caption-button pill drawn into the plate at x=701..793)
plate_insets = 27 100 9 9
# extended frames (CLIENT-PROTOCOL.md): caption-band rows stretched when a client extends the plate down into its header. Rows 2..14
# hold the caption-button pill, so only the lower part of the caption gradient (15..24, above the 25/26 inner lines) is stretched
extend_rows = 15 25
# Explorer plate (LgFrameExplorer = msstyles STREAM 484, active top half / inactive bottom half of the 801x1214 PNG): used instead
# of the normal plate when a client extends the frame's top into its header (_LHWM_EXTEND_FRAME top > 0). desksrv 4074 9-grids it
# with a 73 px top band (texture margins 9,73 / 100,9); the rest of the grid is the normal plate's
# explorer_rows = r0 r1 line: rows 0..14 (pill) stay 1:1, the band [15, 71) is stretched to the header's height minus 2, and the
# texture's inner light/dark lines (rows 78/79; the texture's client area starts at row 80) go on the header's last two rows. A 46 px
# extension (27 + 46 = 73) copies rows 0..70 1:1
# maximised plates (README "Maximised mode"): LGFRAMEMAX = STREAM 493, MAXEXPLORER = STREAM 494 (787x1198, opaque dark grey, active
# top half / inactive bottom half, 599 rows each; the same art as 5048's uDWM BITMAP 1002), drawn instead of the normal plate while
# maximised. LGFRAMEMAX: caption rows 0..24 (sheen), light/dark lines at rows 25/26, body from 27, 1 px edge lines at x 0/1 and 785/786
# and rows 597/598; no caption-button pill. desksrv 4074 9-grids it with texture margins (0, 27) (0, 0): the whole width stretches
plate_max = plate_max_active.png plate_max_inactive.png
max_insets = 27 0 0 0
# MAXEXPLORER: the band is rows 0..77 (sheen over all of it), lines 78/79, body from 80 (desksrv: margins (0, 71) (0, 0)); the band
# [0, 78) is stretched to the header's height - 2 and the lines go on its last two rows, as explorer_rows does for the Explorer plate
# screenshots/aero_max.png: the buttons end 3 px further right than on a normal frame (close's bright end column 4 px before the
# work area's right edge; best fit right 2, top 2, gap 2)
max_button_right = 2
# glass weight: the plate's alpha is multiplied by glass_alpha (plates only: overlay, buttons, fog unchanged). 0.5 fits the 4074
# Documents window (COMPOSITION.md 15.3: header rmse 30 -> 6.4); glass_alpha_mode = square (alpha^2, the 5048 equation, rmse 5.2,
# use it with glass_alpha = 1.0) is the parameter-free alternative
# parameter-free choice (COMPOSITION.md 15, fit 5.6 vs 6.3): the 5048 equation
glass_alpha = 1.0
glass_alpha_mode = square
# no caption fog over extended headers: 4074 draws none (fit with fog: 31, without: 5.6); fog = 1 re-enables captionfog.png
fog = 0
overlay = 0
# frame margins: the client sits inside the dark 1px lines at x=8, x=792, y=26, y=598 of the texture
margins = 27 9 9 9
# overlay texture (811x615) reaches past the plate (801x607) by top right bottom left px; its highlight line
# (texture x=5/805, y=4/610) then lies on the plate's inset-1 line (x=1/799, y=1/605)
# caption buttons: sprite sheets with 4 frames of frame_h each (normal, hot, pressed, inactive)
button_frame_h = 14
button_top = 2
button_right = 5
button_gap = 2
# measured: 4074-dwm.png buttons end 5 px before the frame edge (sprite col 41, the bright end line, sits 7 px from it)
# order from the right edge
buttons = close max min
# caption text
font = Segoe UI 9
text_active = #1e1e1e
text_inactive = #5a5a5a
glow = #ffffff
# maximised caption text (README "Maximised caption text"; COMPOSITION.md 19: CompositedWindow defines no text colours, the maximised look
# lives in the rest of the style: Explorer's title turns white with the glow dropped, inactive maximised text stays (98,100,105); fits
# screenshots/aero_max.png, white title on the dark LGFRAMEMAX header). Faded with the plate crossfade.
text_max_active = #ffffff
text_max_inactive = #626469
glow_max = none
# default_icon.png: CompositedWindow DEFAULTICON (msstyles STREAM 506, 20x17), shown for clients without an icon; drawn 1:1
title_x = 28
icon_x = 8
icon_size = 16
# the visual style this directory caches (README "libuxtheme source": read live through libuxtheme when luxwm has it)
msstyles = styles/aero5048.msstyles
color = NormalColor
size = Normal
