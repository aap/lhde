; A source of lhde's resource pack (tools/lhde-pack, tools/lhdeimport.py; docs/USAGE.md "Getting the Windows resources").
; [source] where the files are: iso = the medium's file name (lhde-pack --isos DIR), layout = wim (7z) | wim0108 (build 4015) |
; cab (an I386/AMD64 setup layout, *.XX_ expanded), wim = its path on the medium, image = the WIM image, windows = the Windows
; directory inside it; detect = the version prefix of version_file (default explorer.exe) that tells lhde-import --iso/--wim/
; --dir which source a medium is; default = no: only with lhde-pack --all / --sources.
; [files] PACK PATH = IN-IMAGE PATH[ | ...]: raw, unmodified files only. A pack path ending in / is a directory: the path below
; the pattern's fixed part goes there (globs: * ? ** {a,b}; case-insensitive).
; [styles] NAME = pack path of a .msstyles: imported as styles/NAME.msstyles (+ the Shell/ beside it as styles/NAME/Shell).
; [frames] / [packs] TARGET = RECIPE ARGS: what lhde-import derives (tools/lhdeimport.py RECIPES) into a cache/ with a manifest.

[source]
id      = 4066
title   = Longhorn build 4066 (Jade; an I386 setup layout)
build   = 4066
iso     = longhorn4066.iso
layout  = cab
detect  = 6.5.4066
version_file = I386/EXPLORER.EX_
default = yes

[files]
system32/shell32.dll  = I386/SHELL32.DL_
system32/imageres.dll = I386/IMAGERES.DL_
system32/browseui.dll = I386/BROWSEUI.DL_
system32/comctl32.dll = I386/COMCTL32.DL_
system32/themeui.dll  = I386/THEMEUI.DL_
system32/explorer.exe = I386/EXPLORER.EX_
themes/Jade/jade.msstyles   = I386/JADE.MS_
themes/jade.theme           = I386/JADE.TH_
themes/Slate/slate.msstyles = I386/SLATE.MS_
themes/slate.theme          = I386/SLATE.TH_
themes/Luna/luna.msstyles   = I386/LUNA.MS_
themes/Luna.theme           = I386/LUNA.TH_
fonts/      = I386/{MARLETT,MICROSS,SEGUIBK,SEGUIBD,TAHOMA,TAHOMABD,TREBUC,TREBUCBD,TREBUCBI,TREBUCIT}.TT_
wallpapers/ = I386/{BLISS,LNGHRNM6,ASCENT,AUTUMN,AZUL,CRYSTAL,FOLLOW,FRIEND,HOME,MOON,PEACE,POWER,PURPLEF,RADIANCE,REDMOON,RIPPLE,STONEH,TULIPS,VORTEC,WIND,WINXP}.JP_

[styles]
jade4066 = themes/Jade/jade.msstyles
slate4066 = themes/Slate/slate.msstyles
luna4066 = themes/Luna/luna.msstyles
