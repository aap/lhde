; A source of lhde's resource pack (tools/lhde-pack, tools/lhdeimport.py; docs/USAGE.md "Getting the Windows resources").
; [source] where the files are: iso = the medium's file name (lhde-pack --isos DIR), layout = wim (7z) | wim0108 (build 4015) |
; cab (an I386/AMD64 setup layout, *.XX_ expanded), wim = its path on the medium, image = the WIM image, windows = the Windows
; directory inside it; detect = the version prefix of version_file (default explorer.exe) that tells lhde-import --iso/--wim/
; --dir which source a medium is; default = no: only with lhde-pack --all / --sources.
; [files] PACK PATH = IN-IMAGE PATH[ | ...]: raw, unmodified files only. A pack path ending in / is a directory: the path below
; the pattern's fixed part goes there (globs: * ? ** {a,b}; case-insensitive).
; [styles] NAME = pack path of a .msstyles: imported as styles/NAME.msstyles (+ the Shell/ beside it as styles/NAME/Shell).
; [frames] / [packs] TARGET = RECIPE ARGS: what lhde-import derives (tools/lhdeimport.py RECIPES) into a cache/ with a manifest.

[source]
id      = xp
title   = Windows XP's Luna and shell (from Windows Server 2003 R2 x64 CD1: the same resources as XP)
build   = xp
iso     = Windows Server 2003 R2 Enterprise Corp x64 CD1.iso
layout  = cab
detect  = 6.0.3790
version_file = AMD64/EXPLORER.EX_
default = yes

[files]
system32/shell32.dll   = AMD64/SHELL32.DL_
system32/explorer.exe  = AMD64/EXPLORER.EX_
system32/browseui.dll  = AMD64/BROWSEUI.DL_
system32/comctl32.dll  = AMD64/COMCTL32.DL_
system32/themeui.dll   = AMD64/THEMEUI.DL_
system32/shellstyle.dll = AMD64/CLASS_SS.DL_
themes/Luna/luna.msstyles = AMD64/LUNA.MS_
themes/Luna.theme         = AMD64/LUNA.TH_
themes/Luna/Shell/NormalColor/shellstyle.dll = AMD64/BLUE_SS.DL_
themes/Luna/Shell/HomeStead/shellstyle.dll   = AMD64/HOME_SS.DL_
themes/Luna/Shell/Metallic/shellstyle.dll    = AMD64/METAL_SS.DL_
fonts/      = AMD64/{TAHOMA,TAHOMABD,TREBUC,TREBUCBD,TREBUCBI,TREBUCIT}.TT_
wallpapers/ = AMD64/{BLISS,ASCENT,AUTUMN,AZUL,CRYSTAL,FOLLOW,FRIEND,HOME,MOON,PEACE,POWER,PURPLEF,RADIANCE,REDMOON,RIPPLE,STONEH,TULIPS,VORTEC,WIND,WINXP}.JP_

[styles]
; XP's own Luna (PACKTHEM_VERSION 3) with its three schemes' shellstyle.dll (decision 2: styles/luna)
luna = themes/Luna/luna.msstyles
