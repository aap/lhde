; A source of lhde's resource pack (tools/lhde-pack, tools/lhdeimport.py; docs/USAGE.md "Getting the Windows resources").
; [source] where the files are: iso = the medium's file name (lhde-pack --isos DIR), layout = wim (7z) | wim0108 (build 4015) |
; cab (an I386/AMD64 setup layout, *.XX_ expanded), wim = its path on the medium, image = the WIM image, windows = the Windows
; directory inside it; detect = the version prefix of version_file (default explorer.exe) that tells lhde-import --iso/--wim/
; --dir which source a medium is; default = no: only with lhde-pack --all / --sources.
; [files] PACK PATH = IN-IMAGE PATH[ | ...]: raw, unmodified files only. A pack path ending in / is a directory: the path below
; the pattern's fixed part goes there (globs: * ? ** {a,b}; case-insensitive).
; [styles] NAME = pack path of a .msstyles: imported as styles/NAME.msstyles (+ the Shell/ beside it as styles/NAME/Shell).
; [frames] / [packs] TARGET = RECIPE ARGS: what lhde-import derives (tools/lhdeimport.py RECIPES) into a cache/ with a manifest.

[source]
id      = 4015
title   = Longhorn build 4015 (March 2003; Plex, the DCE compositor)
build   = 4015
iso     = longhorn4015.iso
layout  = wim0108
wim     = SOURCES/INSTALL.WIM
image   = 2
windows = WINDOWS
detect  = 6.5.4015
default = yes

[files]
system32/shell32.dll   = I386/shell32.dll
system32/imageres.dll  = I386/imageres.dll
system32/browseui.dll  = I386/browseui.dll
system32/comctl32.dll  = I386/comctl32.dll
system32/themeui.dll   = I386/themeui.dll
system32/explorer.exe  = explorer.exe
themes/                = Resources/Themes/**
fonts/                 = Fonts/{seguibk,seguibd,segoeui,segoeuib,segoeuii,segoeuiz,tahoma,tahomabd,trebuc,trebucbd,trebucbi,trebucit}.ttf
wallpapers/            = Web/Wallpaper/*

[styles]
plex4015 = themes/Plex/plex.msstyles
luna4015 = themes/Luna/luna.msstyles
