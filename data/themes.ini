; lhde theme registry (imported from x11 d353b69; SHELL-DESIGN.md 6.1, format in docs/THEMES.md). Transitional: step 4 of
; docs/LAYOUT.md replaces it with theme files (data/themes/*.theme) and one resolver; until then luxwm, luxshell and flxp read it.
; One section per theme name; the name is what the root property _LH_THEME holds. luxwm and luxshell publish its resolved copy
; (every path absolute, $XDG_RUNTIME_DIR/lhde/<display>/themes.ini, with wallpapers.ini beside it) as the root property
; _LH_THEMES_INI, so readers that resolve against the registry's own directory (flxp, navdemo, scripts) see the same files.
; Paths are relative to lhde's data directories (lhtheme/lhde_data.h: $LHDE_DATA or ~/.local/share/lhde, then
; <prefix>/share/lhde, $XDG_DATA_DIRS/lhde, the source tree's data/), or absolute / ~/... Lists are space separated.
; Comments: ';' or '#' at the start of a line, or after whitespace at the end of one.
; The art lives in the user's data directory, filled by tools/lhde-import (docs/LAYOUT.md "Asset policy"): styles/ (visual
; styles, build-qualified names), fonts/<build>, resources/<build> (a build's system32), frames/<name> and packs/<build> (their
; pixels). The text halves of frames/<name> (theme.ini, nav.ini) and packs/<name> (shell.lua) ship in data/. Wallpapers are not
; here: wallpapers.ini (THEMES.md "Wallpapers"); a `wallpaper` key in a section would still win over it, but none ships.
;
;   msstyles       the visual style uxtheme clients load (flxp: FLXP_THEME); luxwm reads it live through libwuxtheme for the
;                  frame (docs/LUXWM.md "libuxtheme source"): the classic frames are drawn from it, `frame` only adds tuning keys
;   color, size    its colour scheme and size (FLXP_THEME_COLOR, FLXP_THEME_SIZE; the 4074/4051 .theme files say
;                  ColorStyle=Default, Size=Normal; `ut-dump FILE` lists a style's names)
;   frame          luxwm frame set (frames/NAME: theme.ini + pixels) while composited (DWM glass themes) or always (msstyles
;                  themes). Optional with msstyles: luxwm then draws the style's own classic frame (needs libwuxtheme; the frame
;                  set is the PNG cache and tuning keys, tools/msstyles2theme.py output)
;   frame_classic  luxwm frame set without a compositor, or with composition = off. Empty (or missing) or `style`: the
;                  entry's own msstyles drawn live in msstyles mode (its Window class through libwuxtheme; docs/LUXWM.md
;                  "Classic fallback"), the frame set's theme.ini fallback_theme if that style has no Window class
;   shell          luxshell pack (packs/NAME: shell.lua; its images under packs/<build>/)
;   startpanel     luxshell start panel when it is not the pack's own (packs/startpanels.lua names)
;   composition    auto: glass frames while a compositor runs, frame_classic otherwise; off: always frame_classic
;                  (Longhorn's USESCOMPOSITION=FALSE, the "no DWM" look)
;   aliases        older names that select this theme (the x11-era lhwm theme directory names: LAB_THEME=jade, ...)
;   title          display name for theme lists
;   fonts          font directories (or files), ';' separated, registered by luxwm and luxshell as fontconfig application fonts
;                  while the theme is active (THEMES.md "Fonts"): the build's own WINDOWS/Fonts, so the msstyles' "Segoe UI 9"
;                  resolves to the Segoe UI 0.7 that 4074 ships (seguibk.ttf / seguibd.ttf; fonts/5048 holds byte-identical
;                  copies). Without it Segoe UI falls back (DejaVu Sans for "Segoe UI 9", Tahoma where the converter wrote
;                  "Segoe UI,Tahoma")
;   flxp_*         flxp only (THEMES.md "flxp's own keys"): flxp_msstyles (an XP-format style its uxtheme can load),
;                  flxp_icons, flxp_longhorn_system32, flxp_explorer_resources, flxp_menubar_style, ... = the
;                  flxp.ini key of the same name, per theme; flxp.ini wins where it sets one. flxp_msstyles is set on every
;                  Longhorn-format entry: flxp finds an XP backport by the style's file name, and the import renames styles

; The longhorn.ms "Aero" patch style for 4074 (not a Microsoft file; was [aero4074], which stays an alias)
[aero-patch]
title = Aero (4074 patch style, glass)
fonts = fonts/4074
msstyles = styles/aero-patch.msstyles
color = Default
size = Normal
frame = frames/aero-patch
frame_classic = frames/jade4074-classic
shell = packs/4074-aero
composition = auto
aliases = aero4074 aero
flxp_msstyles = styles/jade4074-xp/jade.msstyles   ; aero-patch.msstyles is Longhorn-compiled: Jade's XP backport for flxp
flxp_icons = longhorn
flxp_longhorn_system32 = resources/4074
flxp_menubar_style = document
flxp_frame = longhorn
taskbar = avalon   ; per-theme defaults (THEMES.md "Per-theme shell settings"), overridable in Display Properties
start = flxp   ; aap 2026-10-25: flxp's start panel everywhere; lux's own menu only as fallback or via override

