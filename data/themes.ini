; XP's own Luna (the PACKTHEM_VERSION 3 file of a real XP, copied from the Wine prefix; styles/luna-xp.msstyles),
; with no frame set: luxwm draws the frame from the style through libwuxtheme (docs/LUXWM.md "libuxtheme source"; nothing
; converted, tuning keys at their defaults: XP styles get bi-level caption text). Without libwuxtheme luxwm cannot load this entry and
; keeps the current theme. The same holds for the XP styles after it.
[luna-xp]
title = Windows XP (Luna, real XP style)
fonts = fonts/4074   ; Trebuchet MS (XP's caption font) and Tahoma from 4074
msstyles = styles/luna-xp.msstyles
color = NormalColor
size = NormalSize
shell = packs/4074-slate
startpanel = luna-blue
composition = off
flxp_frame = xp   ; flxp: the XP explorer (toolbar, Address bar), no Longhorn header
taskbar = classic   ; per-theme defaults (THEMES.md "Per-theme shell settings"), overridable in Display Properties
start = flxp
flxp_icons = xp

; Microsoft's later XP visual styles (the workspace's resources/xp-themes/, from XP_Themes.zip; all PACKTHEM_VERSION 3, so flxp's uxtheme loads them
; as they are and luxwm draws their frames live, no frame set). No lux pack of their own: the Slate bars stand in (the classic
; taskbar, flxp-taskbar, is drawn from the style itself); flxp's start panel. Each style's ShellStyle.dll (the explorer task pane)
; is in its xp-themes/<Style>/Shell/<scheme>/ directory; nothing reads it yet.
[royale]
title = Royale (XP Media Center Edition 2005)
fonts = fonts/4074   ; Trebuchet MS (caption) and Tahoma
msstyles = styles/royale.msstyles
color = NormalColor   ; the only scheme ("default blue color scheme")
size = NormalSize
shell = packs/4074-slate
composition = off
aliases = mce energy-blue
flxp_frame = xp
flxp_icons = xp
taskbar = classic
start = flxp

