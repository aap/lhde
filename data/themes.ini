; Windows XP's Luna, from the Longhorn 4051 copy of luna.msstyles (an XP visual style that build still ships, compiled in the
; Longhorn format: styles/luna4051.msstyles). Frames: tools/msstyles2theme.py (docs/LUXWM.md "Classic msstyles
; mode"), one per colour scheme. No glass and no Luna taskbar/sidebar pack yet: the Slate pack stands in; the start menu is Luna's
; own (startpanel). [luna-xp] below is the real XP file; the two stay separate entries.
[luna]
title = Windows XP (Luna, 4051 copy)
fonts = fonts/4074   ; 4051's Fonts are not extracted: 4074's Tahoma/Trebuchet MS (XP's caption font)
msstyles = styles/luna4051.msstyles
color = NormalColor
size = NormalSize
frame = frames/luna4051-blue
frame_classic = frames/luna4051-blue
shell = packs/4074-slate
startpanel = luna-blue   ; the XP start panel (packs/startpanels.lua, packs/4051/startpanel-luna-blue) with the Slate bars
composition = off
flxp_msstyles = styles/luna-xp.msstyles   ; the real XP (PACKTHEM_VERSION 3) Luna for flxp's uxtheme
aliases = luna-blue luna4051
flxp_frame = xp   ; flxp: the XP explorer (toolbar, Address bar), no Longhorn header
taskbar = classic   ; per-theme defaults (THEMES.md "Per-theme shell settings"), overridable in Display Properties
start = flxp
flxp_icons = xp

