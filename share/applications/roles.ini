        application/x-zstd-compressed-tar application/x-lzip-compressed-tar application/x-7z-compressed application/vnd.rar
        application/gzip application/x-bzip application/x-bzip2 application/x-xz application/x-lzma application/zstd
        application/x-lzip application/x-lha application/x-arj application/x-cpio application/x-ace application/vnd.ms-cab-compressed
