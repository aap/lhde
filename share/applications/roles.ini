; lhde's program roles (docs/SETTINGS.md "Default programs"): what XP's Set Program Access and Defaults calls the default
; web browser, e-mail program, media player, ..., each a set of file types that one program opens. The user picks a program
; per role (settings.ini [programs] ROLE = ID.desktop; Default Programs, lhde-mime role), and lhde-mime roles apply writes
; it as the default of every type of the role into ~/.local/share/applications/lhde-mimeapps.list.
;
; Installed as $PREFIX/share/lhde/applications/roles.ini. A user's ~/.config/lhde/applications/roles.ini is read over it,
; key by key: a role's key there wins, a section of its own adds a role.
;
; A role's keys:
;   label        the role's name (Default Programs' list)
;   question     the sentence above its programs, XP's "Choose a default Web browser:"
;   current      the choice that leaves the role's types to the other files, XP's "Use my current Web browser"
;   types        types, or patterns (image/*) matched against the mime database's types; a type named here belongs to the
;                first role that names it
;   descendants  every type whose parents (shared-mime-info's subclasses, text/* under text/plain) reach one of these, read
;                when the roles are applied, so a text type installed later follows; a type another role names stays its
;   exclude      patterns taken out of this role's types
;   prefer       lhde's choice when settings.ini sets none: the first of these that is installed (none installed: the role
;                sets nothing); the programs offered list these first
;   categories   the programs offered: the installed ones that claim one of the role's types (MimeType=) and have one of
;                these in Categories= (the Desktop Menu spec's), or are in prefer; without the key every claimant
; A list is words separated by spaces; an indented line without = goes on with the list above it. Types are canonical
; names (aliases are resolved). The terminal is no role: it is settings.ini [commands] terminal.

[editor]
label = Text editor
question = Choose a default text editor:
current = Use my current text editor
types = text/plain
descendants = text/plain
; text/plain's descendants that are not text to edit: other media (pictures as SVG, playlists, 3D models, molecules, mail),
; word processors' documents, launchers and shortcuts that another program opens, other programs' project files, fonts,
; signatures and encodings; Markdown and Typst, which lhde's defaults give to the document viewer mupf (it belongs to no
; role: a role gives each of its types to the program chosen, which a viewer that cannot read them would get)
exclude = text/markdown text/x-typst image/* audio/* video/* model/* chemical/* message/* application/vnd.apple.mpegurl application/mbox application/rtf application/x-abiword application/x-lyx
          application/vnd.oasis.opendocument.* application/x-fictionbook+xml application/x-desktop application/x-mswinurl
          application/x-nautilus-link application/x-java-jnlp-file application/x-ica application/vnd.flatpak.*
          application/x-audacity-project application/x-musescore* application/x-dia-* application/x-qtiplot
          application/x-kommander application/x-godot-project application/x-tiled-* application/x-go-sgf
          application/x-mozilla-bookmarks application/x-xbel application/x-kgetlist application/x-magicpoint
          application/x-font-* application/vnd.font-* application/pkcs7-signature application/mac-binhex40
categories = TextEditor
prefer = luxpad.desktop org.gnome.TextEditor.desktop gnome-text-editor.desktop mousepad.desktop org.xfce.mousepad.desktop
         featherpad.desktop l3afpad.desktop leafpad.desktop pluma.desktop xed.desktop org.gnome.gedit.desktop gedit.desktop
         org.kde.kate.desktop org.kde.kwrite.desktop geany.desktop

[images]
label = Image viewer
question = Choose a default image viewer:
current = Use my current image viewer
; every picture but the drawings (SVG, WMF and EMF, CAD files, Xfig, Skencil), the page formats (PostScript, DjVu: the
; document viewer's), the image editors' own files (GIMP's XCF and brushes, Photoshop, OpenRaster), 3D scenes, cursors
types = image/*
exclude = image/svg+xml image/svg+xml-compressed image/wmf image/emf image/x-wmf image/x-emf image/cgm image/vnd.dwg
          image/vnd.dxf image/x-xfig image/x-skencil image/x-eps image/x-bzeps image/x-gzeps image/vnd.djvu
          image/vnd.djvu+multipage image/x-xcf image/x-compressed-xcf image/x-gimp-* image/vnd.adobe.photoshop
          image/openraster image/x-3ds image/x-lwo image/x-lws image/x-xcursor image/x-gtk-path-animation image/x-applix-graphics
          image/x-msod image/vnd.ms-modi image/vnd.rn-realpix
categories = Viewer
prefer = luxview.desktop feh.desktop nsxiv.desktop sxiv.desktop org.gnome.eog.desktop eog.desktop org.gnome.Loupe.desktop ristretto.desktop
         org.xfce.ristretto.desktop viewnior.desktop gpicview.desktop qimgv.desktop imv.desktop org.kde.gwenview.desktop
         gwenview.desktop org.gnome.gThumb.desktop gthumb.desktop

[pdf]
label = Document viewer
question = Choose a default viewer for PDF and other page documents:
current = Use my current document viewer
; documents that are pages to look at: PDF, PostScript (and EPS), DjVu, XPS
types = application/pdf application/x-bzpdf application/x-gzpdf application/x-xzpdf application/postscript
        application/x-bzpostscript application/x-gzpostscript image/x-eps image/x-bzeps image/x-gzeps image/vnd.djvu
        image/vnd.djvu+multipage application/oxps application/vnd.ms-xpsdocument
