; A source of lhde's resource pack (tools/lhde-pack, tools/lhdeimport.py; docs/USAGE.md "Getting the Windows resources").
; [source] where the files are: iso = the medium's file name (lhde-pack --isos DIR), layout = wim (7z) | wim0108 (build 4015) |
; cab (an I386/AMD64 setup layout, *.XX_ expanded) | live (a Windows directory on the medium itself, read with 7z: windows =
; its name), wim = its path on the medium, image = the WIM image, windows = the Windows directory inside it; detect = the
; version prefix of version_file (default explorer.exe) that tells lhde-import --iso/--wim/--dir which source a medium is;
; default = no: only with lhde-pack --all / --sources.
; [files] PACK PATH = IN-IMAGE PATH[ | ...]: raw, unmodified files only. A pack path ending in / is a directory: the path below
; the pattern's fixed part goes there (globs: * ? ** {a,b}; case-insensitive). Layout cab: CABINET::MEMBER is one file taken out of
; a multi-file cabinet (4066's .NET assemblies in I386/WINDOWS.CAB).
; [styles] NAME = pack path of a .msstyles: imported as styles/NAME.msstyles (+ the Shell/ beside it as styles/NAME/Shell).
; [schemes] NAME = pack path of a hive INF: its classic Appearance schemes as styles/<scheme>.scheme (tools/lhdeschemes.py).
; [frames] / [packs] / [aurora] TARGET = RECIPE ARGS: what lhde-import derives (tools/lhdeimport.py RECIPES) into generated/
; with a manifest.

[source]
id      = reactos
title   = ReactOS 0.4.16 (free: GPL/LGPL shell DLLs with Windows' resource ids, Marlett and Tahoma, four visual styles)
build   = reactos
iso     = ReactOS-0.4.16-i386.iso
; the boot CD carries the live system as a plain directory (reactos/): the same files reactos.cab holds for setup
layout  = live
windows = reactos
detect  = 0.4.
version_file = explorer.exe
; lhde-pack leaves it out unless asked (--sources reactos, --all): the free part is a pack of its own (make free-pack, which
; make install-resources-free downloads), a Windows resource pack stays Windows' files
default = no

[files]
; the shell's art by resource id (ReactOS keeps XP's ids: shell32's icons, browseui's toolbar strips 214-217, Go 230/231,
; brand 240, the Folders bar close 545; explorer.exe's start bitmap 143)
system32/shell32.dll  = system32/shell32.dll
system32/browseui.dll = system32/browseui.dll
system32/comctl32.dll = system32/comctl32.dll
system32/themeui.dll  = system32/themeui.dll
system32/explorer.exe = explorer.exe
themes/Lunar/lunar.msstyles   = Resources/Themes/Lunar/lunar.msstyles
themes/Modern/modern.msstyles = Resources/Themes/Modern/modern.msstyles
themes/Mizu/mizu.msstyles     = Resources/Themes/Mizu/mizu.msstyles
themes/Lautus/lautus.msstyles = Resources/Themes/Lautus/lautus.msstyles
; the faces Windows programs and lhde ask for by name (Tahoma, Microsoft Sans Serif, Marlett, Trebuchet MS, Verdana, ...):
; ReactOS's free metric-compatible fonts under the Windows file names
fonts/      = Fonts/{Marlett,tahoma,tahomabd,micross,trebuc,trebucbd,trebucbi,trebucit,verdana,verdanab,verdanai,verdanaz,arial,arialbd,arialbi,ariali,ariblk,cour,courbd,courbi,couri,times,timesbd,timesbi,timesi,lucon,symbol,wingding,comic,comicbd,georgia,georgiab,georgiai,georgiaz,pala,palab,palabi,palai,framd,framdit}.ttf
wallpapers/ = Web/Wallpaper/*.{jpg,png,txt}

[styles]
; ReactOS's own visual styles (PACKTHEM v3, XP's format); Blackshade is only unbuilt sources in ReactOS's tree (a placeholder
; its build skips), so there is no fifth style to take
lunar  = themes/Lunar/lunar.msstyles
modern = themes/Modern/modern.msstyles
mizu   = themes/Mizu/mizu.msstyles
lautus = themes/Lautus/lautus.msstyles
