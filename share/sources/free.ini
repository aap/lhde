; A source of lhde's resource pack (tools/lhde-pack; the keys: share/sources/reactos.ini). Not a Windows build: the wallpapers
; of the free themes (lunar, lautus, mizu, modern), photos from Pexels under the Pexels licence (free to use, no attribution
; required: pexels.com/license), chosen by aap; free-wallpapers-LICENSE.txt names each. They go into the free pack beside
; ReactOS's files (make free-pack), not into the repository.
; The medium is a directory holding the downloaded files under Pexels's names: lhde-pack --medium free=DIR (make free-pack:
; FREE_WALLPAPERS), or lhde-import --dir DIR --source free. Only the files named here are taken; a share:FILE path is lhde's
; own file beside this ini. The pack names keep the photographer and the photo id: the themes' Desktop.wallpaper says
; free/<photographer>-<id>.

[source]
id      = free
title   = lhde's free wallpapers (Pexels photos, the Pexels licence)
build   = free
layout  = tree
; only with lhde-pack --sources free (make free-pack): the directory is named with --medium
default = no

[files]
wallpapers/timmossholder-9398211.jpg   = pexels-timmossholder-9398211.jpg
wallpapers/ian-panelo-8669635.jpg      = pexels-ian-panelo-8669635.jpg
wallpapers/marek-piwnicki-12966762.jpg = pexels-marek-piwnicki-3907296-12966762.jpg
wallpapers/diva-30887567.jpg           = pexels-diva-30887567.jpg
wallpapers/LICENSE.txt                 = share:free-wallpapers-LICENSE.txt
