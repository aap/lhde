# luxwm frame set: Windows Vista build 5112 (Beta 1, July 2005), the later Aero (COMPOSITION.md 21).
# 5112's uDWM.dll carries no bitmaps (5048's BITMAP 1000-1014 are gone): it reads the frame from the visual style through
# GetThemeStream, class DWMWindow of aero.msstyles, whose parts name RT STREAM PNGs by a new DISKSTREAM property (straight alpha,
# IMAGECOUNT states stacked vertically). The frame is piecewise, DWMGlass::DWMWindow.TOPFRAME 481 (61x25 per state),
# LEFTFRAME 479 / RIGHTFRAME 480 (9x10), BOTTOMFRAME 478 (61x9); DWMMetal:: 482-485 is the opaque alternative. tools/
# build_aero5112.py composes them into one 801x607 plate per state (5048's size) and builds the button sprites (button part +
# glyph). Not used: the corner/side highlights 464/474/476 (226x173 / 5x116 white sheen), REFLECTIONMAP 473 (800x600 streaks,
# opacity 100 active / 50 inactive) and the shadows 452/465/475/477 (picom draws the shadow).
mode = dwm
# without a compositor the theme's frames_classic (none: the style's own decorations) draws the style's Window class; this theme is the last resort
# (and the classic frame when the directory is set through _LHWM_THEME): LUXWM.md "Classic fallback"
fallback_theme = jade4074-classic
# plate 9-slice insets top right bottom left: TOPFRAME's 25 rows (3-row outer edge, 20 rows of caption glass, the client's
# light/dark lines on rows 23/24) and the 9 px side/bottom frame (TOPFRAME/LEFTFRAME SIZINGMARGINS keep the corner columns)
plate_insets = 25 9 9 9
margins = 25 9 9 9
# extended frames: the caption glass rows 3..22 stretch; rows 23/24 (inner lines) go on the header's last two rows
extend_rows = 3 23
# maximised: MAXTOPFRAME 472 (201x26 per state, opaque dark, SIZINGMARGINS 0 0 1 1, stretched to 787) + MAXLEFT/RIGHT/BOTTOM
plate_max = plate_max_active.png plate_max_inactive.png
max_insets = 26 9 9 9
# glass: the 5112 milcore shaders blur the half-size background (SS_HORIZONTALGAUSSIANBLUR2D + SS_VERTICALGAUSSIANBLURANDCONTRAST2D,
# 8 taps each, then out = clamp(1.5 * blur - 0.25)) and write it unblended; the frame PNGs are straight alpha laid over that
# (active body alpha 56/255, inactive 24/255). No alpha squaring as in 5048's BlurUnder_Glass: linear, factor 1
glass_alpha = 1.0
glass_alpha_mode = linear
fog = 0
overlay = 0
# caption buttons: BUTTONCAPTIONEND 454 (min, rounded bottom-left), BUTTONCAPTION 453 (max/restore), BUTTONCLOSE 455 (red, rounded
# bottom-right), 4 states of 15 rows: normal (only the rim; the glass shows through), hot, pressed, inactive; glyphs 458-463 centred
# in the parts' CONTENTMARGINS. They abut (no gap) and hang from the frame's top edge
button_frame_h = 15
button_top = 1
button_right = 6
button_gap = 0
buttons = close max min
# BUTTONGLOW 459 (48x36), BUTTONCLOSEGLOW 457 (59x31): the same sizes as 5048's glow bitmaps
# caption text: DWMWindow.TOPFRAME(ACTIVE) TEXTCOLOR 0 34 82, (INACTIVE) 75 75 75, GLOWCOLOR white, TEXTGLOWSIZE 10
font = Segoe UI 9
text_active = #002252
text_inactive = #4b4b4b
glow = #ffffff
# MAXTOPFRAME(ACTIVE) TEXTCOLOR 255 255 255, (INACTIVE) 190 190 190, GLOWCOLOR 0 0 0
text_max_active = #ffffff
text_max_inactive = #bebebe
glow_max = #000000
title_x = 28
icon_x = 8
icon_size = 16
msstyles = styles/aero5112.msstyles
color = NormalColor
size = Normal
