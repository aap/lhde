; The class map of window and program icons (liblhde lhde/icon.h, docs/THEME-FORMAT.md section 9): a window without an icon of
; its own (_NET_WM_ICON) whose WM_CLASS class or instance matches a pattern gets that icon key of the icon set
; (icons/NAME.theme [icons]); a value no recipe knows is taken as an XDG icon name or an absolute path. Patterns are shell
; globs, matched without case, several to a line; the first matching line wins, and a user's ~/.config/lhde/icons/apps.ini
; is read before this one. Without a match the window's desktop file (StartupWMClass, its name) gives the icon, then the
; generic application icon (exe).
[classes]
; console windows: Windows puts cmd.exe's icon on every one
urxvt rxvt* xterm uxterm st st-256color alacritty kitty foot footclient konsole *terminal* terminator tilix sakura lxterminal cmd = cmd
; lhde's own programs (their own window icon when they set one: flxp-settings and luxpad do)
flxp-settings = display
luxpad = notepad
luxattr = settings
luxshot = image
flxp* = explorer
; programs Windows had a counterpart of
firefox* Firefox* chromium* Chromium* google-chrome* epiphany* librewolf* = browser
thunderbird* Thunderbird* evolution* claws-mail* = mail
leafpad mousepad gedit gnome-text-editor xed pluma featherpad l3afpad = notepad
