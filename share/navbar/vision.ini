# luxnav tuning for Aero vision (luxnav/lhnav.h lhnav_metrics; read by luxnav clients from the frame set directory, i.e.
# the first field of _LHWM_THEME, and again on every theme reload: edit and save with session/theme-watch.sh running, or run
# session/theme-reload.sh). Colours #RRGGBB or "style" (from the visual style).
#
# PRESETS (docs/NAVBAR.md "Presets"). Each "[preset NAME]" section is one complete header size with all keys; `preset = NAME`
# below picks the one clients use. To try a new size, copy a section, rename it and change it; examples/navdemo cycles through
# the sections live with the p key (P backwards) and shows the preset's name in its title. Keys written before the first section
# apply to every preset (a section's own keys win); a key missing everywhere has luxnav's built-in default.
#
# HAND PLACEMENT (all presets; applied after the automatic layout, each element against its own automatic place):
#   *_dx / *_dy   nudge: pixels / rows added (+ = right / down); the box moves, its text and segments with it
#   *_x / *_y     absolute: x in client pixels from the client's left edge (negative: from the right edge), y in FRAME rows from
#                 the frame's top edge (the client's row 0 is frame row 2 under Aero vision); empty = automatic
#   *_w / *_h     size; empty = automatic
# NAVDEMO_DEBUG=1 examples/navdemo prints every final rect (client x, y, frame row, size) to read the numbers off.
# The comments give each key's automatic value at a 720 px wide navdemo client (border_t 2, caption buttons at x 627).
#
# THE RIGHT-HAND TOOLBAR (all presets; docs/NAVBAR.md "Toolbar"): `tools` lists the items left to right, right-aligned before
# pad_r; blanks (or commas) separate them, an item with blanks goes in "double quotes". The kinds:
#   search_field          the search box (search_w wide, shrinking with the window down to search_min; placed by search_*)
#   search                the magnifier glyph button (the concept's look; shell32's Search icon): a click brings the search
#                         field out left of it and focuses it; it goes back when it loses the focus empty
#   favorites             the star orb (the style's Favorites::AnimationButton, SmallFavorites up to 35 px): the bookmarks list
#                         ($XDG_CONFIG_HOME/gtk-3.0/bookmarks) with "Add current folder" at the top
#   bookmark:PATH[:LABEL] a folder button going straight to PATH (~ = home; PATH without ':'); LABEL is its tooltip
#   views                 XP's Views button with its drop-down arrow (shell32's toolbar strip, cell 32)
#   newfolder             XP's New Folder button (cell 31): "New Folder", "New Folder (2)", ...
#   separator             a thin vertical line
# e.g. `tools = search_field` (the look before the toolbar), `tools = search favorites` (the concept art),
#      `tools = newfolder views separator "bookmark:~/Music:My Music" search favorites`.
# tool_size: the star and the magnifier (the magnifier is 4/5 of it), 0 = auto (the orb part's height - 2, at most what fits the
# header around the row); tool_icon: the icon buttons' icon (16, 24, 32); tool_gap: between items; tools_dx / tools_dy move every
# item except the search field (which follows search_*; the items are centred on its row, so search_dy moves them too).
# sep_last: the breadcrumb chevron after the last segment (its subfolders): 0 never, 1 always, 2 while the breadcrumb is hovered.
# icon_dir: a build's system32 with shell32.dll for the icons (empty: navdemo takes the theme's path.resources).
#
# ART SOURCE (all presets; a preset section may set its own): where the travel buttons, the favorites star and the breadcrumb's
# hover boxes and arrows come from (docs/NAVBAR.md "Where the art comes from"; LHNAV_DEBUG=1 or NAVDEMO_DEBUG=1 lists each piece):
#   art_style = auto          the theme's own visual style: TravelBack/TravelFwd::AnimationButton (4051-4074, the aero patch), or
#                             Vista's TravelBand (5048, 5112: the plate with the history chevron and the two glyph orbs, unscaled)
#   art_style = NAME          styles/NAME.msstyles from lhde's data directories, e.g. aero-patch (the patched aero resources: the
#                             big Longhorn orbs the presets below are measured on); an absolute path names the file itself.
#                             Text (fonts, the breadcrumb colours and glow) stays the theme's style's.
# A style with none of these gets luxnav's drawn orbs (logged once: "STYLE has no travel art: ...").
art_style = auto
preset = big

# ---------------------------------------------------------------------------------------------------------------------------------
# small: NAVBAR.md's small-button variant: 15 deco + 30 orb row (the orb only, no drop-down arrows) + 2 = 47 rows
[preset small]
variant = small
# >>> the common nudges: move the breadcrumb box / the search box down (+) or up (-) by whole rows, text included
address_dy = 3
search_dy = 3
#
# vertical geometry, frame rows from the window's top edge: deco_h + orb_h + gap = header (47); header_h replaces the sum
deco_h = 15
orb_h = 30
gap = 2
header_h =
box_h = 21
lines = 2
resize_rows = 3
# horizontal layout, client pixels
pad_l = 0
pad_r = 4
title_x = 54
box_gap = 8
search_w = 180
search_min = 90
crumb_pad = 6
sep_w = 15
crumb_x = 2
# text: title_dy moves the title's baseline (rows), crumb_dy all text inside the two boxes (box stays)
title_dy = 4
crumb_dy = 0
# --- hand placement (automatic values at 720 px) ---
# the back/forward pair, top-left: auto x 0, frame row 15 (44x30: back 26 + forward 18 at x 26)
orb_x =
orb_y =
orb_dx = 0
orb_dy = -3
# the breadcrumb box: auto x 52, frame row 19, 476x21 (x: after the orb + box_gap; w: up to the search box - box_gap)
address_x =
address_y =
address_dx = 0
address_w =
address_h =
# the search box: auto x 536, frame row 19, 180x21 (x: 4 from the right edge; width = search_w above)
search_x =
search_y =
search_dx = 0
search_h =
# the title: x = title_x + title_dx; baseline auto frame row 15 (= deco_h), then + title_dy
title_dx = 0
title_baseline =
# the breadcrumb text inside its segments (segment cells and their hover boxes stay): auto 0 0
crumb_text_dx = 0
crumb_text_dy = 0
# fonts: empty = the style's CompositedBreadcrumbBar::Toolbar FONT (aero-patch: Segoe UI, 12 px)
title_font = Segoe UI, 10
crumb_font =
# text on glass: black text over a white halo (blur radius glow_size, -1 = the style's TEXTGLOWSIZE: 4; strength = gain)
title_rgb = #000000
crumb_rgb = style
glow_rgb = style
glow_size = -1
glow_strength = 2.5
# the breadcrumb field: 0 only while editing, 1 on hover, 2 always; the search field: 0 on hover, 1 always
address_field = 1
search_field = 1
field_alpha = 0.30
# the right-hand toolbar (see the top): today's look is the search box alone
tools = search_field
tool_size = 0
tool_icon = 16
tool_gap = 4
tools_dx = 0
tools_dy = 0
sep_last = 2
icon_dir =
# art_dir = DIR with nav_back.png / nav_fwd.png (orb-only state strips) to override the style's travel buttons (small only)

