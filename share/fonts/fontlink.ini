; Font linking (wux's GDI, wux/gdi/font.h load_font_links; docs/USAGE.md "Font linking"): Windows' registry key
; HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\FontLink\SystemLink. A character the font's face lacks is drawn with the
; first face of its line that has it, at the font's height, weight and style, on the font's baseline; then fontconfig's
; faces for the character; the missing glyph only when no face has it. Families, not files: a family that is not installed
; is skipped. The faces named here are XP's East Asian fonts (MS UI Gothic: msgothic.ttc, Gulim: gulim.ttc, SimSun:
; simsun.ttc, PMingLiU: mingliu.ttc). A user's ~/.config/lhde/fonts/fontlink.ini is read instead of
; this one.
[SystemLink]
; XP's own lines (with the East Asian languages installed)
Tahoma               = MS UI Gothic, Gulim, SimSun, PMingLiU
Microsoft Sans Serif = MS UI Gothic, Gulim, SimSun, PMingLiU
Lucida Sans Unicode  = MS UI Gothic, Gulim, SimSun, PMingLiU
MS UI Gothic         = Gulim, SimSun, PMingLiU
Gulim                = MS UI Gothic, SimSun, PMingLiU
SimSun               = MS UI Gothic, Gulim, PMingLiU
PMingLiU             = MS UI Gothic, Gulim, SimSun
; Vista's Segoe UI line links Tahoma first, then its own East Asian faces; Longhorn's Segoe UI takes XP's
Segoe UI             = Tahoma, MS UI Gothic, Gulim, SimSun, PMingLiU
; not Windows' lines (XP's SystemLink names no fixed-pitch face), a choice: the fixed-pitch members of the same files,
; so East Asian text in luxpad is fixed-pitch too (one em to a character)
Lucida Console       = MS Gothic, GulimChe, NSimSun, MingLiU
Courier New          = MS Gothic, GulimChe, NSimSun, MingLiU
